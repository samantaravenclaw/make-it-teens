<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Читательский дневник Регины</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --night: #071b38;
      --blue: #174f91;
      --sky: #d9f1ff;
      --bronze: #c89443;
      --paper: #fffdf4;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--night);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 12% 10%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 78% 18%, #fff 0 1px, transparent 2px),
        linear-gradient(150deg, #c8ebff, #6ca8dc 55%, #173f78);
      background-size: 150px 150px, 190px 190px, auto;
      background-attachment: fixed;
    }

    header {
      position: relative;
      overflow: hidden;
      padding: 28px 20px 42px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #06172f, #174f91);
      border-bottom: 5px solid var(--bronze);
    }

    header::before,
    header::after {
      position: absolute;
      color: #f4d58b;
      opacity: .9;
      filter: drop-shadow(0 0 12px #fff7bd88);
      pointer-events: none;
    }

    header::before {
      content: "☾  ✦  ✧";
      top: 28px;
      left: clamp(18px, 8vw, 110px);
      font-size: clamp(24px, 4vw, 45px);
      transform: rotate(-8deg);
    }

    header::after {
      content: "✧  ✦  🪶";
      right: clamp(18px, 8vw, 110px);
      bottom: 28px;
      font-size: clamp(22px, 3vw, 38px);
      transform: rotate(8deg);
    }

    .back {
      display: inline-block;
      margin-bottom: 24px;
      color: #d9f1ff;
      font: 700 16px system-ui, sans-serif;
    }

    h1 {
      position: relative;
      margin: 0;
      font-size: clamp(42px, 7vw, 76px);
      text-shadow: 0 4px 0 #071b38, 0 0 25px #83cfff88;
    }

    header p {
      margin: 14px 0 0;
      color: #d9f1ff;
      font: 19px/1.5 system-ui, sans-serif;
    }

    main {
      width: min(920px, calc(100% - 30px));
      margin: 42px auto 70px;
    }

    .form-card, .book {
      background: linear-gradient(145deg, #fffef8, #edf7ff);
      border: 2px solid #fff;
      border-radius: 22px;
      box-shadow: 0 18px 42px #08274e44;
    }

    .form-card {
      position: relative;
      padding: clamp(24px, 5vw, 44px);
      border: 3px double var(--bronze);
    }

    .form-card::after {
      content: "🪄";
      position: absolute;
      top: 20px;
      right: 24px;
      font-size: 30px;
      transform: rotate(-18deg);
    }

    h2 { margin: 0 0 22px; font-size: 32px; }

    form {
      display: grid;
      grid-template-columns: 1.2fr 1fr .7fr auto;
      gap: 14px;
      align-items: end;
    }

    label {
      display: grid;
      gap: 7px;
      font: 700 15px system-ui, sans-serif;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      color: var(--night);
      background: white;
      border: 2px solid #aacbe7;
      border-radius: 12px;
      font: 17px system-ui, sans-serif;
    }

    input:focus { outline: 3px solid #75bff4; border-color: var(--blue); }

    button {
      padding: 14px 20px;
      color: white;
      background: var(--blue);
      border: 0;
      border-radius: 12px;
      font: 800 16px system-ui, sans-serif;
      cursor: pointer;
    }

    button:hover { background: #0f3e76; }

    .books {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      margin-top: 28px;
      align-items: start;
    }

    .series-column {
      display: grid;
      gap: 18px;
    }

    .series-column > h2 {
      margin: 0;
      padding: 18px 22px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #071b38, #174f91 72%, #2c6eaa);
      border: 3px solid var(--bronze);
      border-radius: 18px;
      box-shadow: inset 0 0 20px #8bcfff22, 0 10px 22px #071b3833;
    }

    .series-total {
      margin: 0;
      padding: 18px 20px;
      color: white;
      text-align: center;
      background: var(--blue);
      border: 3px solid var(--bronze);
      border-radius: 18px;
      font: 800 18px system-ui, sans-serif;
    }

    .grand-total {
      grid-column: 1 / -1;
      margin: 8px 0 0;
      padding: 24px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, var(--night), var(--blue));
      border: 4px solid var(--bronze);
      border-radius: 22px;
      font: 900 22px system-ui, sans-serif;
      box-shadow: 0 12px 28px rgba(9, 38, 73, .22);
    }

    .book {
      position: relative;
      min-height: 165px;
      padding: 24px 70px 24px 24px;
      border-left: 10px solid var(--bronze);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .book:hover {
      transform: translateY(-5px) rotate(.3deg);
      box-shadow: 0 22px 46px #08274e66;
    }

    .book::after {
      content: "🦅";
      position: absolute;
      right: 24px;
      top: 24px;
      color: var(--bronze);
      font-size: 30px;
    }

    .book h3 { margin: 0 0 12px; font-size: 25px; }
    .book p { margin: 7px 0; font: 17px/1.45 system-ui, sans-serif; }
    .empty { color: white; text-align: center; font: 18px system-ui, sans-serif; }

    .edition-note {
      margin: 22px 0 0;
      color: #d9f1ff;
      text-align: center;
      font: 15px/1.5 system-ui, sans-serif;
    }

    @media (max-width: 760px) {
      form, .books { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../portfolio/index.html">← Вернуться в портфолио</a>
    <h1>📚 Читательский дневник</h1>
    <p>Книги, которые я прочитала</p>
  </header>

  <main>
    <section class="form-card">
      <h2>Добавить книгу</h2>
      <form id="bookForm">
        <label>Название<input id="title" required></label>
        <label>Автор<input id="author" required></label>
        <label>Страниц<input id="pages" type="number" min="1" required></label>
        <button type="submit">Добавить</button>
      </form>
    </section>
    <section class="books" id="books" aria-live="polite"></section>
    <p class="edition-note">Для Гарри Поттера указаны распространённые издания «РОСМЭН», для книг Рика Риордана — издания Disney-Hyperion. В другом тираже число страниц может отличаться.</p>
  </main>

  <script>
    const form = document.querySelector('#bookForm');
    const booksNode = document.querySelector('#books');
    const storageKey = 'regina-reading-diary';
    const harryPotterBooks = [
      { title: 'Гарри Поттер и философский камень', author: 'Дж. К. Ролинг', pages: 400 },
      { title: 'Гарри Поттер и Тайная комната', author: 'Дж. К. Ролинг', pages: 480 },
      { title: 'Гарри Поттер и узник Азкабана', author: 'Дж. К. Ролинг', pages: 512 },
      { title: 'Гарри Поттер и Кубок огня', author: 'Дж. К. Ролинг', pages: 667 },
      { title: 'Гарри Поттер и Орден Феникса', author: 'Дж. К. Ролинг', pages: 827 },
      { title: 'Гарри Поттер и Принц-полукровка', author: 'Дж. К. Ролинг', pages: 672 },
      { title: 'Гарри Поттер и Дары Смерти', author: 'Дж. К. Ролинг', pages: 640 }
    ];
    const rickRiordanBooks = [
      { title: 'Перси Джексон и похититель молний', author: 'Рик Риордан', pages: 416 },
      { title: 'Перси Джексон и Море чудовищ', author: 'Рик Риордан', pages: 320 },
      { title: 'Перси Джексон и проклятие титана', author: 'Рик Риордан', pages: 352 },
      { title: 'Перси Джексон и лабиринт смерти', author: 'Рик Риордан', pages: 400 },
      { title: 'Перси Джексон и последнее пророчество', author: 'Рик Риордан', pages: 432 },
      { title: 'Герои Олимпа. Пропавший герой', author: 'Рик Риордан', pages: 592 },
      { title: 'Герои Олимпа. Сын Нептуна', author: 'Рик Риордан', pages: 560 },
      { title: 'Герои Олимпа. Метка Афины', author: 'Рик Риордан', pages: 624 },
      { title: 'Герои Олимпа. Дом Аида', author: 'Рик Риордан', pages: 672 },
      { title: 'Герои Олимпа. Кровь Олимпа', author: 'Рик Риордан', pages: 560 },
      { title: 'Магнус Чейз и боги Асгарда. Меч Лета', author: 'Рик Риордан', pages: 528 },
      { title: 'Магнус Чейз и боги Асгарда. Молот Тора', author: 'Рик Риордан', pages: 480 },
      { title: 'Магнус Чейз и боги Асгарда. Корабль мертвецов', author: 'Рик Риордан', pages: 432 }
    ];
    const fioleanaBooks = [
      { title: 'Хроники загадочного Острова, или Файолеана', author: 'Мария Голикова', pages: 700 }
    ];
    const narniaBooks = [
      { title: 'Племянник чародея', author: 'Клайв Стейплз Льюис', pages: 160 },
      { title: 'Лев, Колдунья и платяной шкаф', author: 'Клайв Стейплз Льюис', pages: 192 },
      { title: 'Конь и его мальчик', author: 'Клайв Стейплз Льюис', pages: 160 },
      { title: 'Принц Каспиан', author: 'Клайв Стейплз Льюис', pages: 224 },
      { title: '«Покоритель зари», или Плавание на край света', author: 'Клайв Стейплз Льюис', pages: 256 },
      { title: 'Серебряное кресло', author: 'Клайв Стейплз Льюис', pages: 240 },
      { title: 'Последняя битва', author: 'Клайв Стейплз Льюис', pages: 192 }
    ];
    let books = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const savedTitles = new Set(books.map(book => book.title.toLowerCase()));
    [...harryPotterBooks, ...rickRiordanBooks, ...fioleanaBooks, ...narniaBooks].forEach(book => {
      if (!savedTitles.has(book.title.toLowerCase())) books.push(book);
    });
    localStorage.setItem(storageKey, JSON.stringify(books));

    function render() {
      booksNode.innerHTML = '';
      if (books.length === 0) {
        booksNode.innerHTML = '<p class="empty">Здесь появится первая прочитанная книга ✨</p>';
        return;
      }

      function seriesFor(book) {
        const title = book.title.toLowerCase();
        if (title.includes('гарри поттер')) return '⚡ Гарри Поттер';
        if (title.startsWith('перси джексон')) return '🔱 Перси Джексон и олимпийцы';
        if (title.startsWith('герои олимпа')) return '🏛️ Герои Олимпа';
        if (title.startsWith('магнус чейз')) return '⚔️ Магнус Чейз и боги Асгарда';
        if (title.includes('файолеан')) return '🏝️ Файолеана';
        if (book.author.toLowerCase().includes('льюис')) return '🦁 Хроники Нарнии';
        return '📖 Другие книги';
      }

      const grouped = new Map();
      books.forEach(book => {
        const series = seriesFor(book);
        if (!grouped.has(series)) grouped.set(series, []);
        grouped.get(series).push(book);
      });

      const columns = [...grouped].map(([title, seriesBooks]) => ({ title, books: seriesBooks }));

      columns.forEach(column => {
        const section = document.createElement('section');
        section.className = 'series-column';
        const heading = document.createElement('h2');
        heading.textContent = column.title;
        section.append(heading);

        column.books.forEach(book => {
        const card = document.createElement('article');
        card.className = 'book';
        const title = document.createElement('h3');
        title.textContent = book.title;
        const author = document.createElement('p');
        author.textContent = `Автор: ${book.author}`;
        const pages = document.createElement('p');
        pages.textContent = `Страниц: ${book.pages}`;
        card.append(title, author, pages);
          section.append(card);
        });

        const total = document.createElement('p');
        total.className = 'series-total';
        const totalPages = column.books.reduce((sum, book) => sum + Number(book.pages), 0);
        total.textContent = `Всего в серии: ${totalPages.toLocaleString('ru-RU')} страниц`;
        section.append(total);

        booksNode.append(section);
      });

      const grandTotal = document.createElement('p');
      grandTotal.className = 'grand-total';
      const allPages = books.reduce((sum, book) => sum + Number(book.pages), 0);
      grandTotal.textContent = `Итого: ${books.length} книг • ${allPages.toLocaleString('ru-RU')} страниц`;
      booksNode.append(grandTotal);
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      books.unshift({
        title: document.querySelector('#title').value.trim(),
        author: document.querySelector('#author').value.trim(),
        pages: document.querySelector('#pages').value
      });
      localStorage.setItem(storageKey, JSON.stringify(books));
      form.reset();
      render();
    });

    render();
  </script>
</body>
</html>
